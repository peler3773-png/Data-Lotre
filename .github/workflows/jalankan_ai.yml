name: Jalankan Prediksi AI
on:
  workflow_dispatch:  # Bisa diklik langsung dari halaman GitHub
  schedule:
    - cron: '0 * * * *'  # ✅ Diperbarui TIAP 1 JAM otomatis
jobs:
  jalankan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Semua File
        uses: actions/checkout@v4
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pasang Library
        run: |
          python -m pip install --upgrade pip
          pip install numpy tensorflow-cpu
      - name: Jalankan AI LSTM
        run: python jalankan_ai.py
      - name: Simpan Hasil ke GitHub
        run: |
          git config --global user.name "peler3773-png"
          git config --global user.email "peler3773@users.noreply.github.com"
          git add hasil_prediksi.json
          git commit -m "🤖 Update hasil prediksi $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
