name: Jalankan Prediksi AI

on:
  workflow_dispatch:  # Jalankan manual kapan saja
  schedule:
    # ⏰ Waktu di GitHub = UTC → WIB = UTC+7
    # 0 WIB = 17 UTC (kemarin) | 17.30 WIB = 10.30 UTC
    - cron: '0 17 * * *'   # Pukul 00.00 WIB setiap hari
    - cron: '30 10 * * *'  # Pukul 17.30 WIB setiap hari

jobs:
  jalankan:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Cukup, tidak terlalu lama
    permissions:
      contents: write     # Wajib untuk push hasil
    env:
      TZ: Asia/Jakarta    # Tampil log dalam WIB
    steps:
      - name: Ambil File
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # ✅ Cocok dengan TF 2.15.0

      - name: Pasang Library
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy==1.26.4 tensorflow-cpu==2.15.0
        # Versi spesifik = tidak berubah-ubah

      - name: Jalankan AI
        run: python jalankan_ai.py

      - name: Simpan Hasil
        run: |
          git config --global user.name "peler3773-png"
          git config --global user.email "peler3773@users.noreply.github.com"
          git add hasil_prediksi.json
          git commit -m "🤖 Update $(date +'%Y-%m-%d %H:%M WIB')" --allow-empty
          git push
