name: Jalankan Prediksi AI
on:
  workflow_dispatch:  # Bisa diklik manual
  schedule:
    - cron: '0 */6 * * *'  # Setiap 6 jam otomatis

jobs:
  jalankan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pasang Python & Library
        run: |
          pip install numpy tensorflow
      - name: Jalankan AI
        run: python jalankan_ai.py
      - name: Simpan Hasil
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add hasil_prediksi.json
          git commit -m "🤖 Update hasil prediksi $(date +'%Y-%m-%d %H:%M')" || true
          git push
